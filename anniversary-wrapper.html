<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#1b3031" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Opening Website</title>
    <script>
      (() => {
        // Same theme as the diary (shared localStorage on the same site).
        let theme = "plum";
        try {
          const saved = localStorage.getItem("ourMemoriesTheme");
          if (["plum", "dark", "rose", "light", "lavender", "emo"].includes(saved)) theme = saved;
        } catch {}
        document.documentElement.dataset.theme = theme;
        const themeColors = { plum: "#17101c", dark: "#0f1c1d", rose: "#fff8fb", light: "#fefdf9", lavender: "#fbf8ff", emo: "#070607" };
        document.querySelector('meta[name="theme-color"]')?.setAttribute("content", themeColors[theme]);
      })();
    </script>
    <style>
      :root {
        --body-bg:
          radial-gradient(circle at 18% 16%, var(--glow), transparent 22%),
          radial-gradient(circle at 82% 14%, var(--glow), transparent 24%),
          radial-gradient(circle at 50% 62%, var(--glow), transparent 32%),
          linear-gradient(180deg, var(--bg-1), var(--bg-2), var(--bg-3));
        --card-bg:
          radial-gradient(circle at 5% 6%, var(--glow-2), transparent 27%),
          radial-gradient(circle at 96% 100%, var(--glow-2), transparent 28%),
          linear-gradient(180deg, var(--card-strong), var(--card));
      }

      :root,
      html[data-theme="plum"] {
        color-scheme: dark;
        --bg-1: #17101c;
        --bg-2: #211527;
        --bg-3: #2a1a2a;
        --card: rgba(37, 25, 43, 0.92);
        --card-strong: rgba(52, 33, 56, 0.95);
        --border: rgba(147, 105, 127, 0.75);
        --text: #f4deeb;
        --muted: #c7a8ba;
        --accent: #eeb6c8;
        --retry-bg: rgba(52, 33, 56, 0.95);
        --glow: rgba(98, 55, 88, 0.42);
        --glow-2: rgba(238, 182, 200, 0.16);
        --shadow: 0 24px 60px rgba(8, 4, 12, 0.56);
        --back-btn-bg: rgba(30,18,32,.82);
        --back-btn-text: #f4deeb;
      }

      html[data-theme="dark"] {
        color-scheme: dark;
        --bg-1: #0f1c1d;
        --bg-2: #142728;
        --bg-3: #192a2b;
        --card: rgba(26, 48, 49, 0.9);
        --card-strong: rgba(36, 58, 60, 0.94);
        --border: rgba(84, 126, 122, 0.82);
        --text: #e7f2ee;
        --muted: #a9c4bd;
        --accent: #bfe4d5;
        --retry-bg: rgba(36, 58, 60, 0.94);
        --glow: rgba(78, 120, 116, 0.34);
        --glow-2: rgba(191, 228, 213, 0.16);
        --shadow: 0 24px 60px rgba(2, 8, 8, 0.52);
        --back-btn-bg: rgba(15,28,29,.82);
        --back-btn-text: #e7f2ee;
      }

      html[data-theme="rose"] {
        color-scheme: light;
        --bg-1: #fff8fb;
        --bg-2: #fff0f6;
        --bg-3: #fffdfd;
        --card: rgba(255, 252, 254, 0.94);
        --card-strong: rgba(255, 245, 250, 0.97);
        --border: rgba(201, 149, 170, 0.7);
        --text: #5d3d4b;
        --muted: #8a6675;
        --accent: #c76b8f;
        --retry-bg: rgba(255, 245, 250, 0.97);
        --glow: rgba(242, 197, 215, 0.5);
        --glow-2: rgba(244, 204, 217, 0.5);
        --shadow: 0 24px 60px rgba(198, 133, 160, 0.22);
        --back-btn-bg: rgba(255,240,246,.9);
        --back-btn-text: #5d3d4b;
      }

      html[data-theme="light"] {
        color-scheme: light;
        --bg-1: #fefdf9;
        --bg-2: #fdfbf1;
        --bg-3: #fffdfd;
        --card: rgba(254, 255, 253, 0.95);
        --card-strong: rgba(243, 250, 246, 0.97);
        --border: rgba(148, 191, 174, 0.75);
        --text: #3f5150;
        --muted: #687e7c;
        --accent: #4f8f78;
        --retry-bg: rgba(243, 250, 246, 0.97);
        --glow: rgba(208, 235, 224, 0.6);
        --glow-2: rgba(227, 162, 143, 0.18);
        --shadow: 0 24px 60px rgba(120, 160, 140, 0.22);
        --back-btn-bg: rgba(240,250,245,.92);
        --back-btn-text: #3f5150;
      }

      html[data-theme="lavender"] {
        color-scheme: light;
        --bg-1: #fbf8ff;
        --bg-2: #f6f0ff;
        --bg-3: #fdfcff;
        --card: rgba(253, 252, 255, 0.95);
        --card-strong: rgba(246, 240, 255, 0.97);
        --border: rgba(173, 152, 198, 0.72);
        --text: #4a3d5d;
        --muted: #76668a;
        --accent: #8d6fbf;
        --retry-bg: rgba(246, 240, 255, 0.97);
        --glow: rgba(223, 206, 242, 0.6);
        --glow-2: rgba(205, 186, 235, 0.4);
        --shadow: 0 24px 60px rgba(150, 120, 190, 0.22);
        --back-btn-bg: rgba(246,240,255,.92);
        --back-btn-text: #4a3d5d;
      }

      html[data-theme="emo"] {
        color-scheme: dark;
        --bg-1: #070607;
        --bg-2: #0d0b0d;
        --bg-3: #120d0f;
        --card: rgba(14, 12, 14, 0.94);
        --card-strong: rgba(26, 10, 14, 0.96);
        --border: rgba(193, 18, 31, 0.7);
        --text: #ece6e8;
        --muted: #9b9196;
        --accent: #e5383b;
        --retry-bg: rgba(26, 10, 14, 0.96);
        --glow: rgba(120, 6, 18, 0.45);
        --glow-2: rgba(229, 56, 59, 0.14);
        --shadow: 0 24px 60px rgba(0, 0, 0, 0.7);
        --back-btn-bg: rgba(10,8,9,.88);
        --back-btn-text: #ece6e8;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
        background-color: var(--bg-1);
      }

      body {
        position: relative;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) 24px
          max(24px, env(safe-area-inset-bottom));
        color: var(--text);
        background: transparent;
        font-family: "Quicksand", "Segoe UI", sans-serif;
        overflow: hidden;
        isolation: isolate;
      }

      body::before {
        content: "";
        position: fixed;
        inset: -100vmax;
        z-index: -1;
        pointer-events: none;
        background: var(--body-bg);
      }

      main {
        width: min(90vw, 520px);
        padding: clamp(28px, 6vw, 44px);
        border: 1px solid var(--border);
        border-radius: 34px;
        background: var(--card-bg);
        box-shadow: var(--shadow);
        text-align: center;
        position: relative;
        isolation: isolate;
      }

      .eyebrow {
        position: relative;
        z-index: 2;
        margin: 0 0 12px;
        color: var(--muted);
        font-family: "Fredoka", "Quicksand", sans-serif;
        font-size: 0.9rem;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        position: relative;
        z-index: 2;
        margin: 0;
        font-family: "Fredoka", "Quicksand", sans-serif;
        font-size: clamp(2.1rem, 8vw, 3.7rem);
        line-height: 1.02;
        text-transform: lowercase;
      }

      p {
        position: relative;
        z-index: 2;
        margin: 14px auto 0;
        max-width: 30rem;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.5;
      }

      .retry-btn {
        position: relative;
        z-index: 2;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        margin-top: 22px;
        padding: 0 20px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--retry-bg);
        color: var(--text);
        font-weight: 700;
        text-decoration: none;
        box-shadow: 0 12px 28px rgba(2, 8, 8, 0.24);
        cursor: pointer;
        font: inherit;
      }

      .retry-btn[hidden] {
        display: none;
      }

      .loading-dots {
        position: relative;
        z-index: 2;
        display: inline-flex;
        justify-content: center;
        gap: 8px;
        margin-top: 24px;
      }

      @media (max-width: 640px) {
        body {
          padding-inline: 16px;
        }

        main {
          width: min(100%, 520px);
          border-radius: 30px;
        }
      }

      .loading-dots span {
        width: 9px;
        height: 9px;
        border-radius: 999px;
        background: var(--accent);
        opacity: 0.42;
        animation: dotPulse 1.18s ease-in-out infinite;
      }

      .loading-dots span:nth-child(2) {
        animation-delay: 0.16s;
      }

      .loading-dots span:nth-child(3) {
        animation-delay: 0.32s;
      }

      @keyframes dotPulse {
        0%,
        80%,
        100% {
          opacity: 0.38;
          transform: translateY(0);
        }

        40% {
          opacity: 1;
          transform: translateY(-5px);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">our memories</p>
      <h1>opening website</h1>
      <p id="status">Preparing the anniversary page...</p>
      <div class="loading-dots" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </div>
      <button class="retry-btn" id="retryBtn" type="button" hidden>
        try again
      </button>
      <p><a href="./" style="color: inherit">← back to our diary</a></p>
    </main>
    <script>
      const params = new URLSearchParams(location.search);
      const statusEl = document.getElementById("status");
      const retryBtn = document.getElementById("retryBtn");
      const wrapperUrl = location.href.split("#")[0].split("?")[0];

      const defaultConfig = {
        supabaseUrl: "https://ytrbsxknhlsfqkqphlms.supabase.co",
        bucket: "anniversary",
        path: "index.html",
      };

      function setStatus(message) {
        statusEl.textContent = message;
      }

      function encodePath(path) {
        return String(path)
          .split("/")
          .filter(Boolean)
          .map((segment) => encodeURIComponent(segment))
          .join("/");
      }

      function buildPublicUrl(config) {
        const base = String(config.supabaseUrl || "").replace(/\/+$/, "");
        if (!base || !config.bucket || !config.path) return "";
        return `${base}/storage/v1/object/public/${encodeURIComponent(config.bucket)}/${encodePath(config.path)}`;
      }

      function getConfig() {
        return {
          supabaseUrl: params.get("supabaseUrl") || defaultConfig.supabaseUrl,
          bucket: params.get("bucket") || defaultConfig.bucket,
          path: params.get("path") || defaultConfig.path,
          url: params.get("url") || "",
        };
      }

      function resolveUrl(config) {
        if (config.url && /^https?:\/\//i.test(config.url)) return config.url;
        return buildPublicUrl(config);
      }

      function getAssetBaseUrl(url) {
        return url.slice(0, url.lastIndexOf("/") + 1);
      }

      function addBaseHref(html, url) {
        const baseTag = `<base href="${getAssetBaseUrl(url)}">`;
        if (/<head[\s>]/i.test(html)) {
          return html.replace(/<head([^>]*)>/i, `<head$1>${baseTag}`);
        }
        return `${baseTag}${html}`;
      }

      function escapeInlineScript(script) {
        return script.replace(/<\/script/gi, "<\\/script");
      }

      function escapeStyle(style) {
        return style.replace(/<\/style/gi, "<\\/style");
      }

      function patchNavigationScript(script) {
        return script.replaceAll(
          "window.location.assign(getStoryPath())",
          "window.__openWrappedPage(getStoryPath())",
        );
      }

      function patchInlineNavigation(html) {
        return html
          .replaceAll(
            "window.location.href = 'index.html';",
            "window.__openWrappedPage('index.html');",
          )
          .replaceAll(
            'window.location.href = "index.html";',
            'window.__openWrappedPage("index.html");',
          );
      }

      function injectNavigationBridge(html, sourceUrl) {
        const bridgeCode = `
          window.__openWrappedPage = function (path) {
            const nextUrl = new URL(path, ${JSON.stringify(getAssetBaseUrl(sourceUrl))}).href;
            const launcherUrl = new URL(${JSON.stringify(wrapperUrl)});
            launcherUrl.searchParams.set("url", nextUrl);
            window.location.assign(launcherUrl.href);
          };
        `;
        const closingScriptTag = "<" + "/script>";
        const bridgeTag = `<script>${escapeInlineScript(bridgeCode)}${closingScriptTag}`;

        if (/<head[\s>]/i.test(html)) {
          return html.replace(/<head([^>]*)>/i, `<head$1>${bridgeTag}`);
        }

        return `${bridgeTag}${html}`;
      }

      async function inlinePatchedScripts(html, pageUrl) {
        const pageOrigin = new URL(pageUrl).origin;
        const scriptTagPattern =
          /<script\b([^>]*)\bsrc=["']([^"']+\.js[^"']*)["']([^>]*)>\s*<\/script>/gi;
        const replacements = [];

        for (const match of html.matchAll(scriptTagPattern)) {
          const sourceUrl = new URL(match[2], pageUrl);
          if (sourceUrl.origin !== pageOrigin) continue;

          const response = await fetch(sourceUrl.href, { cache: "no-store" });
          if (!response.ok) continue;

          const attrs = `${match[1]}${match[3]}`.replace(
            /\s+(async|defer)\b/gi,
            "",
          );
          const patchedScript = patchNavigationScript(await response.text());
          const closingScriptTag = "<" + "/script>";

          replacements.push({
            from: match[0],
            to: `<script${attrs}>${escapeInlineScript(patchedScript)}${closingScriptTag}`,
          });
        }

        return replacements.reduce(
          (updatedHtml, replacement) =>
            updatedHtml.replace(replacement.from, replacement.to),
          html,
        );
      }

      async function inlineStylesheets(html, pageUrl) {
        const pageOrigin = new URL(pageUrl).origin;
        const stylesheetPattern =
          /<link\b([^>]*)\brel=["']stylesheet["']([^>]*)\bhref=["']([^"']+)["']([^>]*)>/gi;
        const alternateStylesheetPattern =
          /<link\b([^>]*)\bhref=["']([^"']+)["']([^>]*)\brel=["']stylesheet["']([^>]*)>/gi;
        const replacements = [];

        async function queueReplacement(match, href) {
          const sourceUrl = new URL(href, pageUrl);
          if (sourceUrl.origin !== pageOrigin) return;

          const response = await fetch(sourceUrl.href, { cache: "no-store" });
          if (!response.ok) return;

          replacements.push({
            from: match[0],
            to: `<style>${escapeStyle(await response.text())}</style>`,
          });
        }

        for (const match of html.matchAll(stylesheetPattern)) {
          await queueReplacement(match, match[3]);
        }

        for (const match of html.matchAll(alternateStylesheetPattern)) {
          await queueReplacement(match, match[2]);
        }

        return replacements.reduce(
          (updatedHtml, replacement) =>
            updatedHtml.replace(replacement.from, replacement.to),
          html,
        );
      }

      // Floating "back to our diary" button, added to every gift page so there
      // is always a way home (phones/installed app have no browser back).
      function injectBackButton(html) {
        const diaryUrl = new URL("./", wrapperUrl).href;
        const rootStyles = getComputedStyle(document.documentElement);
        const backBg = rootStyles.getPropertyValue("--back-btn-bg").trim() || "rgba(30,18,32,.82)";
        const backText = rootStyles.getPropertyValue("--back-btn-text").trim() || "#fff";
        const backBorder = rootStyles.getPropertyValue("--border").trim() || "transparent";
        const button = `
<a href="${diaryUrl}" id="__diaryBackBtn" aria-label="back to our diary"
  onclick="event.preventDefault();try{if(window.opener!==null||history.length<=1){window.close();}}catch(e){}setTimeout(function(){location.href='${diaryUrl}';},120);"
  style="position:fixed;z-index:2147483647;left:max(12px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));display:inline-flex;align-items:center;gap:6px;padding:9px 15px;border-radius:999px;background:${backBg};color:${backText};border:1px solid ${backBorder};font:600 14px/1 Quicksand,system-ui,sans-serif;text-decoration:none;box-shadow:0 6px 18px rgba(0,0,0,.28);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);">
  <span aria-hidden="true">←</span> back to us ♡
</a>`;
        return /<\/body>/i.test(html)
          ? html.replace(/<\/body>/i, `${button}</body>`)
          : `${html}${button}`;
      }

      async function prepareHtml(html, url) {
        let preparedHtml = html.replace(/^\uFEFF/, "");
        preparedHtml = addBaseHref(preparedHtml, url);
        preparedHtml = injectNavigationBridge(preparedHtml, url);
        preparedHtml = patchInlineNavigation(preparedHtml);
        preparedHtml = await inlineStylesheets(preparedHtml, url);
        preparedHtml = await inlinePatchedScripts(preparedHtml, url);
        preparedHtml = injectBackButton(preparedHtml);
        return preparedHtml;
      }

      async function openWebsite() {
        retryBtn.hidden = true;
        setStatus("Preparing the anniversary page...");

        try {
          const url = resolveUrl(getConfig());
          if (!url) throw new Error("Missing anniversary page URL.");

          const response = await fetch(url, { cache: "no-store" });
          if (!response.ok) {
            throw new Error(`Could not open website (${response.status}).`);
          }

          setStatus("Opening website...");
          const preparedHtml = await prepareHtml(await response.text(), url);
          document.open();
          document.write(preparedHtml);
          document.close();
        } catch (error) {
          console.error(error);
          setStatus("Could not open the anniversary page.");
          retryBtn.hidden = false;
        }
      }

      retryBtn.addEventListener("click", openWebsite);
      openWebsite();
    </script>
  </body>
</html>
